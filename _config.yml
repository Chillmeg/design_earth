# DESIGN EARTH site settings

title: DESIGN EARTH
author: Rania and El Hadi

# The site is served at https://design-earth.org (see the CNAME file).
# For a preview at https://<account>.github.io/<repo>/ without a CNAME, set baseurl: /<repo>.
baseurl: ""
url: https://design-earth.org

collections:
  projects:
    output: true
    permalink: /projects/:name/
  publications:
    output: true
    permalink: /publications/:name/
  exhibitions:
    output: true
    permalink: /exhibitions/:name/
  animations:
    output: true
    permalink: /animations/:name/

defaults:
  - scope: { type: projects }
    values: { layout: slideshow }
  - scope: { type: exhibitions }
    values: { layout: slideshow }
  - scope: { type: publications }
    values: { layout: grow }
  - scope: { type: animations }
    values: { layout: video }

# Slideshows change image by themselves every this many seconds (0 = only on click).
# A page can override it with its own `slideshow_interval:` line.
slideshow_interval: 5

markdown: kramdown
kramdown:
  # keep straight quotes exactly as typed (the old site did not curl them)
  smart_quotes: apos,apos,quot,quot

plugins:
  - jekyll-redirect-from

exclude:
  - files/reference
  - files/dropbox
  - update_rania
  - update_el_hadi
  - README.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
